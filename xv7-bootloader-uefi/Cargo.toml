[package]
name = "xv7-bootloader-uefi"
version = "0.1.0"
authors = ["imtsuki <me@qjx.app>"]
license = "MIT OR Apache-2.0"
description = "XV7 UEFI Bootloader"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
uefi = { version = "0.41.0", features = ["alloc", "global_allocator", "logger", "panic_handler"] }
x86_64 = "0.15.5"
goblin = { version = "0.10.7", default-features = false, features = ["elf32", "elf64", "endian_fd"] }
log = { version = "0.4", default-features = false }
chrono = { version = "0.4.45", default-features = false }
boot = { path = "../xv7-boot", package = "xv7-boot" }
