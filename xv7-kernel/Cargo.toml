[package]
name = "xv7-kernel"
version = "0.1.0"
authors = ["imtsuki <me@qjx.app>"]
license = "MIT OR Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
embedded-graphics = "0.8.2"
tinybmp = "0.7.0"
vte = { version = "0.15.0", default-features = false }
spin = "0.10.0"
linked_list_allocator = "0.10"
goblin = { version = "0.10.7", default-features = false, features = ["elf32", "elf64", "mach32", "mach64", "pe32", "pe64", "archive", "endian_fd"] }
zeroize = "1.8"
boot = { path = "../xv7-boot", package = "xv7-boot" }
abi = { path = "../xv7-abi", package = "xv7-abi" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15.5"
uart_16550 = "0.3"
raw-cpuid = "11.6.0"
pc-keyboard = "0.9.0"

[target.'cfg(target_arch = "aarch64")'.dependencies]
cortex-a = "2.9.0"
